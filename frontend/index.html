    <style>
        * { box-sizing: border-box; }
        body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
        .page { display: none; animation: fadeIn 0.35s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn.active { background: #6d6c70; color: #e2694a !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .input-field { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.375rem; font-size: 0.875rem; background: white; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: #e2694a; box-shadow: 0 0 0 3px rgba(226, 105, 74, 0.1); }
        .input-field:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 150; animation: fadeIn 0.2s ease-out; }
        .modal-overlay.active { display: flex; }
        html.ftlms-has-session #loginScreen { display: none; }
        .modal-content { background: white; border-radius: 0.75rem; padding: 1.5rem; max-width: 560px; width: 94%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }

        .toast.show { display: block; }

        /* ===== Redesigned Login Screen ===== */
        .login-shell {
            position: relative;
            width: min(980px, 100%);
            min-height: 590px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 30px 90px rgba(0,0,0,0.32);
        }

        .login-brand-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 46px;
            overflow: hidden;
            background: #3d3c41;
            color: #fff;
        }

        .login-brand-panel::before,
        .login-brand-panel::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
        }

        .login-brand-panel::before {
            width: 360px;
            height: 360px;
            right: -170px;
            top: -170px;
            border: 1px solid rgba(226,105,74,0.35);
            box-shadow:
                0 0 0 38px rgba(226,105,74,0.05),
                0 0 0 76px rgba(226,105,74,0.035);
        }

        .login-brand-panel::after {
            width: 260px;
            height: 260px;
            left: -150px;
            bottom: -150px;
            background: rgba(226,105,74,0.10);
        }

        .login-brand-content,
        .login-brand-footer {
            position: relative;
            z-index: 2;
        }

.login-logo-wrap {

    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    border-radius: 22px;
    background: rgba(255,255,255,0.96);

    padding: 12px;
}

.login-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

<body>
    <!-- Offline detection — runs before anything else and uses inline
         styles only (not Tailwind classes), since if we're offline the
         Tailwind CDN itself may have failed to load. Sits above every
         other overlay (z-index 300) so it blocks the whole app, login
         screen included, whenever there's no connection. -->
    <div id="offlineScreen" style="display:none; position:fixed; inset:0; z-index:300; background:#3d3c41; color:#fff; align-items:center; justify-content:center; text-align:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:24px;">
        <div>
            <div style="font-size:40px; margin-bottom:12px;">📡</div>
            <div style="font-size:20px; font-weight:700; margin-bottom:6px;">No Internet Connection</div>
            <div style="font-size:14px; color:#94a3b8; max-width:320px; margin:0 auto;">This app needs an internet connection to load properly. Please check your connection and try again.</div>
            <button onclick="location.reload()" style="margin-top:20px; background:#e2694a; color:#3d3c41; font-weight:700; padding:10px 20px; border-radius:6px; border:none; cursor:pointer; font-size:14px;">Retry</button>
        </div>
    </div>
    <script>
        (function () {
            function updateOfflineState() {
                var el = document.getElementById('offlineScreen');
                if (!el) return;
                el.style.display = navigator.onLine ? 'none' : 'flex';
            }
            window.addEventListener('online', updateOfflineState);
            window.addEventListener('offline', updateOfflineState);
            updateOfflineState();
        })();
    </script>

    <!-- Session pre-check — runs synchronously before the browser paints,
         so a returning logged-in user's login screen is hidden via CSS
         immediately instead of flashing visible for a split second before
         main.js's full session validation completes further down the page. -->
    <script>
        (function () {
            // Supabase's own client library stores the session under a key
            // like "sb-<project-ref>-auth-token" — not the old
            // "ftlms-loggedinuser" key from before this app talked to a
            // real backend. This is just a fast synchronous guess to avoid
            // flashing the login screen before checkLoginSession() (in
            // main.js) gets a chance to actually verify the session with
            // Supabase — that async check is still what decides the real
            // final state either way.
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) {
                        document.documentElement.classList.add('ftlms-has-session');
                        break;
                    }
                }
            } catch (e) { /* localStorage unavailable (e.g. private mode) — just show the login screen normally */ }
        })();
    </script>

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#3d3c41] px-4 py-6 overflow-y-auto">
        <div class="login-shell">
            <!-- Brand / visual panel -->
            <section class="login-brand-panel">
                <div class="login-brand-content">
                    <div class="login-logo-wrap">
                        <img src="frontend\images\logo.png" alt="APM Terminals" class="login-logo" />
                        </div>

                    <p class="text-xs font-bold uppercase tracking-[0.22em] text-[#e2694a]">Tyre Management</p>
                    <h1 class="login-brand-title mt-3">T M A <span>.</span></h1>
                    <div class="login-accent-line"></div>

                    <!-- <p class="login-brand-subtitle">
                        A streamlined workspace for managing tyre assets, inspections,
                        equipment, swaps and operational records.
                    </p> -->

                    <div class="login-status-row">
                        <span class="login-status-dot"></span>
                        Secure operational access
                    </div>
                </div>

                <!-- <div class="login-brand-footer">
                    TMA • Tyre Management App
                </div> -->
            </section>

            <!-- Login form -->
            <section class="login-form-panel">
                <h2 class="login-form-heading">Good day!</h2>
                <p class="login-form-description">
                    Sign in to continue.
                </p>

                <div>
                    <div class="login-field">
                        <label for="loginUsername" class="login-label">USERNAME</label>
                        <div class="login-input-wrap">
                            <svg class="login-input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21a8 8 0 0 0-16 0"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input id="loginUsername" class="login-input" placeholder="Enter your username" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('loginPassword').focus()" />
                        </div>
                    </div>

                    <div class="login-field">
                        <label for="loginPassword" class="login-label">PASSWORD</label>
                        <div class="login-input-wrap">
                            <svg class="login-input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="10" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>

                            <input id="loginPassword" type="password" class="login-input pr-12" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter') attemptLogin()" />

                            <button type="button" onclick="toggleLoginPasswordVisibility()" class="login-password-button" title="Show/hide password" tabindex="-1">
                                <svg id="loginPasswordEyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="login-remember">
                            <input id="loginRememberMe" type="checkbox" class="h-3.5 w-3.5 rounded border-slate-300" />
                            <span>Remember me on this device</span>
                        </label>

                        <button type="button" onclick="showForgotPasswordDemo()" class="login-forgot">
                            Forgot password?
                        </button>
                    </div>

                    <div id="loginError" class="login-error hidden"></div>

                    <button id="loginSubmitBtn" onclick="attemptLogin()" class="login-submit">
                        <span id="loginSubmitSpinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                        <span id="loginSubmitLabel">Log In</span>
                    </button>
                </div>

                <p class="login-note">
                    <!-- Accounts are created by an administrator — you cannot self-register. -->
                    Contact your Admin if you need access.
                </p>
            </section>
        </div>
    </div>

    <div id="app" class="min-h-screen bg-slate-50 text-slate-900">
        <!-- Top Nav will be rendered here -->
        <div id="topNav"></div>
        
        <!-- Main Content -->
        <main class="mx-auto max-w-7xl px-4 py-6">
            <div id="page-DASHBOARD" class="page active"></div>
            <div id="page-TYRES" class="page"></div>
            <div id="page-EQUIPMENT" class="page"></div>
            <div id="page-INSPECTIONS" class="page"></div>
            <div id="page-SWAP" class="page"></div>
            <div id="page-USERS" class="page"></div>
            <div id="page-ANALYTICS" class="page"></div>
            <div id="page-EXPORT" class="page"></div>
            <div id="page-PROFILE" class="page"></div>
            <div id="page-ACTIVITY" class="page"></div>
            <div id="page-ADMIN" class="page"></div>
        </main>
        
        <!-- Modals -->
        <div id="tyreModal" class="modal-overlay"></div>
        <div id="equipModal" class="modal-overlay"></div>
        <div id="inspectionModal" class="modal-overlay"></div>
        <div id="crossSummaryModal" class="modal-overlay"></div>
        <div id="confirmModal" class="modal-overlay"></div>
        
        <!-- Toast -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="js/export.js"></script>

    <script src="js/admin.js"></script>

    <script src="js/main.js"></script>
